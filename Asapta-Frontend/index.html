<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asapta task Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<style>
    
        :root {
            --bg: #f7f6f3;
            --surface: #ffffff;
            --surface2: #f0efe9;
            --text: #1a1a18;
            --text-muted: #8a8980;
            --border: #e4e3dc;
            --accent: #2d2d2a;
            --accent-light: #4a4a44;
            --success: #2a7a5a;
            --success-bg: #edf7f2;
            --danger: #c0392b;
            --danger-bg: #fdf0ee;
            --hover: #f4f3ee;
            --shadow: 0 2px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 24px 16px 60px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Subtle dot grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #c8c7c0 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--surface);
            width: 100%;
            max-width: 760px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            overflow: visible;
        }

        /* ── HEADER ── */
        header {
            padding: 28px 28px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #ffffff 0%, #f9f8f4 100%);
            border-radius: 16px 16px 0 0;
        }

        .header-top {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 26px;
            font-weight: 400;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .task-count {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--surface2);
            padding: 3px 9px;
            border-radius: 20px;
            border: 1px solid var(--border);
            letter-spacing: 0.2px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-wrap {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .search-wrap input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface2);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(45,45,42,0.07);
            background: #fff;
        }

        .search-wrap input::placeholder { color: var(--text-muted); }

        /* ── ADD BUTTON (circular +) ── */
        .add-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s, color 0.18s, transform 0.15s, box-shadow 0.18s;
            flex-shrink: 0;
        }

        .add-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(45,45,42,0.22);
            transform: scale(1.07);
        }

        .add-btn:active { transform: scale(0.96); }

        /* ── ADD TASK PANEL (slide-down) ── */
        .add-panel {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.25s;
            opacity: 0;
            border-bottom: 0px solid var(--border);
        }

        .add-panel.open {
            max-height: 120px;
            opacity: 1;
            border-bottom: 1px solid var(--border);
        }

        .add-panel-inner {
            padding: 16px 28px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--hover);
        }

        .add-panel-inner input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        .add-panel-inner input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(45,45,42,0.07);
        }

        .add-panel-inner input::placeholder { color: var(--text-muted); }

        .confirm-add-btn {
            padding: 10px 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.18s, transform 0.12s;
            white-space: nowrap;
        }

        .confirm-add-btn:hover { background: #000; transform: translateY(-1px); }
        .confirm-add-btn:active { transform: translateY(0); }

        .cancel-add-btn {
            padding: 10px 14px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .cancel-add-btn:hover { background: var(--border); }

        /* ── TASK LIST ── */
        ul { list-style: none; }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
            gap: 12px;
        }

        li:last-child { border-bottom: none; }
        li:hover { background: var(--hover); }

        /* Completed row */
        li.done-row { background: var(--success-bg); }
        li.done-row:hover { background: #e4f3ec; }

        .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        /* ── COMPLETE BUTTON (tick style) ── */
        .complete-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            position: relative;
        }

        .complete-btn:hover {
            border-color: var(--success);
            background: var(--success-bg);
            transform: scale(1.1);
        }

        .complete-btn .tick {
            opacity: 0;
            transform: scale(0.4) rotate(-10deg);
            transition: opacity 0.18s, transform 0.2s;
        }

        .complete-btn.done {
            border-color: var(--success);
            background: var(--success);
        }

        .complete-btn.done .tick {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* SVG tick */
        .tick svg {
            width: 11px;
            height: 11px;
            stroke: #fff;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .task-title {
            font-size: 14px;
            font-weight: 400;
            color: var(--text);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.2s;
        }

        .task-title.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .edit-input {
            flex: 1;
            padding: 5px 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            outline: none;
            display: none;
            box-shadow: 0 0 0 3px rgba(45,45,42,0.08);
        }

        .task-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .deadline {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            background: var(--surface2);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        /* ── KABOB MENU ── */
        .menu-container { position: relative; }

        .kabob-btn {
            width: 30px;
            height: 30px;
            background: none;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            letter-spacing: 0;
            line-height: 1;
        }

        .kabob-btn:hover {
            background: var(--surface2);
            color: var(--text);
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            z-index: 200;
            min-width: 150px;
            padding: 4px;
        }

        .dropdown.show { display: block; animation: dropIn 0.15s ease; }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-6px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .dropdown button {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 8px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            color: var(--text);
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.1s;
        }

        .dropdown button:hover { background: var(--hover); }

        .dropdown button.mark-complete-btn {
            color: var(--success);
        }
        .dropdown button.mark-complete-btn:hover { background: var(--success-bg); }

        .dropdown button.delete-btn { color: var(--danger); }
        .dropdown button.delete-btn:hover { background: var(--danger-bg); }

        /* ── EMPTY STATE ── */
        .empty-state {
            padding: 52px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
            font-weight: 400;
        }

        .empty-state small {
            font-size: 13px;
            opacity: 0.7;
        }

        /* ── FOOTER STATS ── */
        .footer-bar {
            padding: 12px 28px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface2);
            border-radius: 0 0 16px 16px;
        }

        .footer-bar span {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .footer-bar .progress-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar-outer {
            width: 100px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background: var(--success);
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            body { padding: 12px 8px 40px; }

            header { padding: 20px 18px 18px; }
            h1 { font-size: 22px; }

            .controls { gap: 8px; }

            .add-panel-inner { padding: 14px 18px; flex-wrap: wrap; }
            .add-panel-inner input { flex: 1 1 100%; }
            .add-panel-inner .confirm-add-btn,
            .add-panel-inner .cancel-add-btn { flex: 1; text-align: center; justify-content: center; }

            li { padding: 12px 14px; gap: 8px; }

            .task-right { gap: 8px; }

            .deadline { display: none; }

            .footer-bar { padding: 10px 18px; }
            .progress-wrap { display: none; }
        }

        @media (max-width: 380px) {
            .task-title { font-size: 13px; }
        }
</style>
<div class="container">
    <header>
        <div class="header-top">
            <h1>ASAPTA</h1>
            <span class="task-count" id="taskCount">0 tasks</span>
        </div>
        <div class="controls">
            <div class="search-wrap">
                <span class="search-icon">⌕</span>
                <input type="text" id="searchInput" placeholder="Search tasks…" oninput="filterTasks()">
            </div>
            <!-- Circular + button -->
            <button class="add-btn" onclick="toggleAddPanel()" title="Add new task" id="addToggleBtn">+</button>
        </div>
    </header>

    <!-- Slide-down add panel -->
    <div class="add-panel" id="addPanel">
        <div class="add-panel-inner">
            <input type="text" id="taskInput" placeholder="What needs to be done?" onkeydown="handleAddKey(event)">
            <button class="confirm-add-btn" onclick="addTask()">Add Task</button>
            <button class="cancel-add-btn" onclick="closeAddPanel()">Cancel</button>
        </div>
    </div>

    <ul id="taskList"></ul>

    <div class="footer-bar">
        <span id="footerText">Loading…</span>
        <div class="progress-wrap">
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
            </div>
            <span id="progressLabel">0%</span>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://localhost:7090/api/task";
    let allTasks = [];
    let addPanelOpen = false;

    // ── LOAD ──
    function loadTasks() {
        fetch(API_URL)
            .then(r => r.json())
            .then(data => {
                allTasks = data;
                renderTasks(allTasks);
                updateStats();
            })
            .catch(() => {
                // Demo mode when API is offline
                if (allTasks.length === 0) {
                    allTasks = [
                        { taskID: 1, taskTitle: "Review project proposal", status: "Completed", dueDate: "2025-06-10" },
                        { taskID: 2, taskTitle: "Set up dev environment", status: "Completed", dueDate: "2025-06-12" },
                        { taskID: 3, taskTitle: "Design database schema", status: "Pending", dueDate: "2025-06-18" },
                        { taskID: 4, taskTitle: "Implement authentication", status: "Pending", dueDate: "2025-06-25" },
                        { taskID: 5, taskTitle: "Write unit tests", status: "Pending", dueDate: null },
                    ];
                }
                renderTasks(allTasks);
                updateStats();
            });
    }

    function renderTasks(tasks) {
        const list = document.getElementById('taskList');

        if (tasks.length === 0) {
            list.innerHTML = `
                <li style="border:none; padding:0;">
                    <div class="empty-state" style="width:100%">
                        <div class="empty-icon">📋</div>
                        <p>No tasks yet</p>
                        <small>Hit the + button to add your first task</small>
                    </div>
                </li>`;
            return;
        }

        list.innerHTML = tasks.map(task => {
            const done = task.status === 'Completed';
            const d = new Date(task.dueDate);
            const dateStr = isNaN(d) ? '' : `Due ${("0"+d.getDate()).slice(-2)}/${("0"+(d.getMonth()+1)).slice(-2)}/${d.getFullYear()}`;

            return `
            <li class="${done ? 'done-row' : ''}" id="row-${task.taskID}">
                <div class="task-left">
                    <button class="complete-btn ${done ? 'done' : ''}"
                        onclick="toggleStatus(${task.taskID})"
                        title="${done ? 'Mark incomplete' : 'Mark complete'}">
                        <span class="tick">
                            <svg viewBox="0 0 12 10">
                                <polyline points="1.5,5.5 4.5,8.5 10.5,1.5"/>
                            </svg>
                        </span>
                    </button>

                    <span id="display-${task.taskID}" class="task-title ${done ? 'completed' : ''}">${task.taskTitle}</span>
                    <input type="text" id="edit-${task.taskID}" class="edit-input"
                        value="${task.taskTitle}"
                        onkeydown="handleEditKey(event, ${task.taskID})"
                        onblur="saveEdit(${task.taskID})">
                </div>

                <div class="task-right">
                    ${dateStr ? `<span class="deadline">${dateStr}</span>` : ''}
                    <div class="menu-container">
                        <button class="kabob-btn" onclick="toggleMenu(event, ${task.taskID})" title="Options">⋮</button>
                        <div id="dropdown-${task.taskID}" class="dropdown">
                            <button onclick="startEdit(${task.taskID})">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                Edit
                            </button>
                            ${!done ? `
                            <button class="mark-complete-btn" onclick="toggleStatus(${task.taskID}); closeAllMenus()">
                                <svg width="13" height="13" viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="1.5,5.5 4.5,8.5 10.5,1.5"/>
                                </svg>
                                Mark Complete
                            </button>` : `
                            <button onclick="toggleStatus(${task.taskID}); closeAllMenus()">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                                Mark Pending
                            </button>`}
                            <button class="delete-btn" onclick="deleteTask(${task.taskID})">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            </li>`;
        }).join('');
    }

    function updateStats() {
        const total = allTasks.length;
        const done  = allTasks.filter(t => t.status === 'Completed').length;
        const pct   = total > 0 ? Math.round((done / total) * 100) : 0;

        document.getElementById('taskCount').textContent = `${total} task${total !== 1 ? 's' : ''}`;
        document.getElementById('footerText').textContent = `${done} of ${total} completed`;
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressLabel').textContent = pct + '%';
    }

    // ── ADD PANEL ──
    function toggleAddPanel() {
        addPanelOpen ? closeAddPanel() : openAddPanel();
    }

    function openAddPanel() {
        addPanelOpen = true;
        const panel = document.getElementById('addPanel');
        panel.classList.add('open');
        document.getElementById('addToggleBtn').style.transform = 'rotate(45deg)';
        document.getElementById('addToggleBtn').style.background = 'var(--accent)';
        document.getElementById('addToggleBtn').style.color = '#fff';
        setTimeout(() => document.getElementById('taskInput').focus(), 120);
    }

    function closeAddPanel() {
        addPanelOpen = false;
        const panel = document.getElementById('addPanel');
        panel.classList.remove('open');
        document.getElementById('taskInput').value = '';
        document.getElementById('addToggleBtn').style.transform = '';
        document.getElementById('addToggleBtn').style.background = '';
        document.getElementById('addToggleBtn').style.color = '';
    }

    function handleAddKey(e) {
        if (e.key === 'Enter') addTask();
        if (e.key === 'Escape') closeAddPanel();
    }

    // ── CRUD ──
    function addTask() {
        const title = document.getElementById('taskInput').value.trim();
        if (title.length < 3) { alert("Task title must be at least 3 characters."); return; }

        // Optimistic local add
        const tempID = Date.now();
        allTasks.unshift({ taskID: tempID, taskTitle: title, status: 'Pending', dueDate: null });
        closeAddPanel();
        renderTasks(allTasks);
        updateStats();

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectID: 1, taskTitle: title, status: "Pending" })
        }).then(() => loadTasks()).catch(() => {/* stay in demo mode */});
    }

    function toggleStatus(id) {
        const task = allTasks.find(t => t.taskID === id);
        if (!task) return;
        const newStatus = task.status === "Pending" ? "Completed" : "Pending";

        // Optimistic update
        task.status = newStatus;
        renderTasks(allTasks);
        updateStats();

        fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskID: id, projectID: 1, taskTitle: task.taskTitle, status: newStatus })
        }).then(() => loadTasks()).catch(() => {/* stay in demo mode */});
    }

    function deleteTask(id) {
        if (!confirm("Delete this task?")) return;
        allTasks = allTasks.filter(t => t.taskID !== id);
        renderTasks(allTasks);
        updateStats();
        fetch(`${API_URL}/${id}`, { method: 'DELETE' }).catch(() => {});
    }

    // ── INLINE EDIT ──
    function startEdit(id) {
        closeAllMenus();
        document.getElementById(`display-${id}`).style.display = 'none';
        const inp = document.getElementById(`edit-${id}`);
        inp.style.display = 'block';
        inp.focus();
        inp.select();
    }

    function handleEditKey(e, id) {
        if (e.key === 'Enter') document.getElementById(`edit-${id}`).blur();
        if (e.key === 'Escape') { loadTasks(); }
    }

    function saveEdit(id) {
        const newTitle = document.getElementById(`edit-${id}`).value.trim();
        const task = allTasks.find(t => t.taskID === id);
        if (!task || newTitle === task.taskTitle) { renderTasks(allTasks); return; }
        if (newTitle.length < 3) { alert("Title too short!"); renderTasks(allTasks); return; }

        task.taskTitle = newTitle;
        renderTasks(allTasks);

        fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskID: id, projectID: 1, taskTitle: newTitle, status: task.status })
        }).catch(() => {});
    }

    // ── SEARCH ──
    function filterTasks() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        renderTasks(q ? allTasks.filter(t => t.taskTitle.toLowerCase().includes(q)) : allTasks);
    }

    // ── MENUS ──
    function toggleMenu(e, id) {
        e.stopPropagation();
        const isOpen = document.getElementById(`dropdown-${id}`).classList.contains('show');
        closeAllMenus();
        if (!isOpen) document.getElementById(`dropdown-${id}`).classList.add('show');
    }

    function closeAllMenus() {
        document.querySelectorAll('.dropdown.show').forEach(d => d.classList.remove('show'));
    }

    window.addEventListener('click', closeAllMenus);

    loadTasks();
</script>
</body>
</html>
